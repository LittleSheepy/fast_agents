[project]
name = "fast-agents"
version = "0.0.1"
description = "简单、灵活、可扩展的多智能体框架"
readme = "README.md"
authors = [
    { name = "LittleSheepy", email = "littlesheepy@qq.com" }
]
requires-python = ">=3.10"
dependencies = [
    "docstring-parser>=0.18.0",
    "duckduckgo-search>=8.1.1",
    "openai>=3.37.0",
    "pydantic>=2.14.1",
    "python-dotenv>=1.2.4",
    "tavily-python>=0.8.5",
    "pyyaml>=6.0.3",
]

[tool.uv.build-backend]
module-root = ""

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"
